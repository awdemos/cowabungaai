apiVersion: v1
kind: Service
metadata:
  name: tensorzero-gw
  namespace: cowabungaai
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorzero-gw
  namespace: cowabungaai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tensorzero-gw
  template:
    metadata:
      labels:
        app: tensorzero-gw
    spec:
      containers:
        - name: proxy
          image: ghcr.io/defenseunicorns/cowabungaai/llm-stub-tzbridge:latest
          ports:
            - containerPort: 3000
