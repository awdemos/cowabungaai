[project]
name = "lfai-whisper"
description = "A LeapfrogAI API-compatible faster-whisper wrapper for audio transcription generation across CPU and GPU infrastructures."

# x-release-please-start-version
version = "0.14.0"
# x-release-please-end

dependencies = [
    "faster-whisper == 1.0.3",
    # faster_whisper.utils imports requests at module import time; without the
    # [dev] extra (CPU builds) nothing else pulls it in transitively.
    "requests",
    "huggingface_hub",
    "cowabunga-sdk",
]
requires-python = "~=3.11"
readme = "README.md"

[project.optional-dependencies]

dev = ["ctranslate2 ==4.4.0", "transformers[torch] == 4.45.1"]

[tool.pip-tools]
generate-hashes = true

[tool.setuptools]
py-modules = ["main"]


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
