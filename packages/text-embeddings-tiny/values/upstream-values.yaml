image:
  repository: "ghcr.io/defenseunicorns/cowabungaai/text-embeddings-tiny"
  tag: "###ZARF_CONST_IMAGE_VERSION###"

# Tiny backend is CPU-only (ONNX runtime) — no GPU runtime class, no GPU limit.
gpu:
  runtimeClassName: ""

resources:
  limits:
    nvidia.com/gpu: "0"
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

persistence:
  size: "###ZARF_VAR_PVC_SIZE###"
  accessModes: "###ZARF_VAR_PVC_ACCESS_MODE###"
  storageClass: "###ZARF_VAR_PVC_STORAGE_CLASS###"
