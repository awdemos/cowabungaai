# yaml-language-server: $schema=https://raw.githubusercontent.com/uds-cli/uds-cli/v0.16.0/zarf.schema.json

kind: ZarfPackageConfig
metadata:
  name: text-embeddings-tiny
  version: "###ZARF_PKG_TMPL_IMAGE_VERSION###"
  description: >
    ONNX MiniLM embeddings backend for CowabungaAI (tiny, no torch)

constants:
  - name: IMAGE_VERSION
    value: "###ZARF_PKG_TMPL_IMAGE_VERSION###"

variables:
  - name: PVC_SIZE
    description: Size of the PVC used for model storage.
    default: "1Gi"
    pattern: "^[0-9]+[a-zA-Z]+$"
  - name: PVC_ACCESS_MODE
    description: Access mode of the PVC used for model storage.
    default: "ReadWriteOnce"
    pattern: "^(ReadWriteOnce|ReadOnlyMany|ReadWriteMany)$"
  - name: PVC_STORAGE_CLASS
    description: Storage class of the PVC used for model storage.
    default: "local-path"

components:
  - name: text-embeddings-tiny
    required: true
    only:
      flavor: upstream
    charts:
      - name: text-embeddings-tiny
        namespace: cowabungaai
        localPath: chart
        releaseName: text-embeddings-tiny
        version: 0.14.0
        valuesFiles:
          - "values/upstream-values.yaml"
    images:
      - ghcr.io/defenseunicorns/cowabungaai/text-embeddings-tiny:###ZARF_PKG_TMPL_IMAGE_VERSION###
      - cgr.dev/chainguard/bash:latest
    dataInjections:
      - source: .model/
        target:
          namespace: cowabungaai
          selector: app=lfai-text-embeddings-tiny
          container: data-loader
          path: /data/.model
        compress: true
    actions:
      onCreate:
        before:
          # NOTE: requires python + huggingface_hub available in $PATH
          - cmd: python scripts/model_download_tiny.py
            env:
              - REPO_ID=Xenova/all-MiniLM-L6-v2
              - REVISION=main
